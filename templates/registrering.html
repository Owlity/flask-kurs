<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <title>Min Flask-side</title>
</head>

<body>
    <p>Denne siden kommer fra en Flask-template.</p>
    <form method="POST">
        <label>Navn:</label>
        <input type="text" name="navn" required>
        <label>E-post:</label>
        <input type="email" name="epost" required>
        <label>Alder:</label>
        <input type="number" name="alder">
        <label>Kommentar:</label>
        <textarea name="kommentar"></textarea>
        <button type="submit">Registrer</button>
    </form>



</body>

</html>
